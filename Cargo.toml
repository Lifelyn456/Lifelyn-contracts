[workspace]
resolver = "2"
members = ["contracts/consent_registry", "contracts/provider_registry", "contracts/record_attestation_registry", "contracts/access_receipt_registry"]

[workspace.dependencies]
soroban-sdk = "27"

[profile.release]
opt-level = "z"
overflow-checks = true
debug = 0
strip = "symbols"
debug-assertions = false
panic = "abort"
codegen-units = 1
lto = true
